
name: Build AdminSwitch JARs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build both mods
        run: gradle -p "$PROJECT_DIR" build

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: AdminSwitch-JARs
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
